submission:
  title: "Bob Engine — FIR Intelligence & Crime Pattern Detector"

  problem_statement: >
    UP Police's CCTNS holds 3+ crore digitized FIRs with no NLP layer, so
    serial, inter-district offenders evade detection because FIR-to-FIR
    links — a reused phone number, a name spelled three ways, a fraud script
    repeated two districts over — are never surfaced. Station Officers,
    District SPs, and state-level analysts currently have no way to spot
    these patterns except manual memory and coincidence.

  solution_summary: >
    Bob Engine ingests digitized FIRs, uses IBM Bob to extract structured
    fields from the raw text (with a deterministic fallback), then
    deterministically resolves suspects across name-transliteration variants
    and shared identifiers, clusters crimes by modus-operandi similarity, and
    surfaces cross-district repeat offenders with an explainable confidence
    score on an RBAC-scoped dashboard.

  key_features:
    - "Explainable entity resolution: exact phone/vehicle match, phonetic+fuzzy name match, and cross-station MO-similarity, each with a human-readable reason"
    - "Transliteration-aware identity linking (e.g. 'Mohd. Aslam' / 'Mohammad Aslaam' / 'M. Aslam' resolve to one person)"
    - "No-name suspects still link, via shared identifiers/description alone"
    - "Server-side RBAC (Station Officer / District SP / State DGP) enforced in the query layer on every read, not cosmetically in the UI"
    - "Interactive criminal-syndicate graph with click-to-dossier"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "SQLModel", "React", "Vite"]
    ibm_technologies: ["IBM Bob"]
    databases: ["PostgreSQL"]
    other: ["Docker", "RapidFuzz", "sentence-transformers", "NetworkX", "Bun"]

  what_we_are_most_proud_of: >
    The entity-resolution + MO-similarity pipeline is verified end-to-end
    against the live database: 6 synthetic FIRs describing the same
    3-person cyber-fraud crew, filed under 5 different name spellings
    across 3 districts (one FIR naming no accused at all), collapse into
    exactly one flagged, explainable syndicate cluster at 0.97 confidence —
    while 94 unrelated noise FIRs correctly stay separate.

  known_limitations: >
    IBM Bob's inference REST endpoint could not be confirmed working in
    this environment (the documented base URL returns a Cloudflare edge
    challenge rather than an API response), so every seeded FIR was
    extracted via the deterministic fallback parser instead of Bob live —
    see docs/setup-guide.md for detail. The extraction contract is
    identical either way, so a confirmed endpoint requires no code change.
    RBAC uses a demo-grade role switcher (no login/auth), the frontend is
    intentionally unstyled, and the earlier copilot/real-time-alerting
    scope was deliberately cut to keep the core pipeline fully working
    end-to-end.

