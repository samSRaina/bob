services:
  postgres:
    image: postgres:16-alpine
    container_name: bob-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cctns_intelligence
    ports:
      - "5544:5432"
    volumes:
      - bob_engine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cctns_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bob_engine_pgdata:
